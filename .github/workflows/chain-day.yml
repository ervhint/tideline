name: chain-day

# T2 (docs/PLAN.md §6): freezes one finished UTC day of intents.near swaps into data/chain/<day>.jsonl (about 80 to 95 min).
# Keyless public reads only (FastNEAR, NEAR RPC, DefiLlama). Every day at 03:17 UTC it freezes yesterday; GitHub runs schedules late.
# A day is written once and never changed. A day that cannot be read well stays a gap, the run fails and Telegram says so; the next
# run does not go back and fill it in.
# It commits only after `npm run verify` passes. By hand, `commit` decides (default off: the files are uploaded as an artifact).
# DISCOVER on looks for new solvers and hubs today; otherwise that happens once a week.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day, YYYY-MM-DD (empty: yesterday)'
        type: string
        default: ''
      commit:
        description: 'Commit the frozen day to the branch this run is on'
        type: boolean
        default: false
      discover:
        description: 'Look for new solvers and hubs today'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: chain-day

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Freeze the day
        env:
          DISCOVER: ${{ inputs.discover && '1' || '' }}
          DAY: ${{ inputs.day }}
        run: node pipeline/chain_day.mjs $DAY
      - name: Rebuild chain_days.json and check it
        run: |
          node pipeline/build_chain_days.mjs
          node pipeline/build_thesis.mjs
          node pipeline/build_reconciliation.mjs
          npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: chain
          path: |
            data/chain/
            data/published/chain_days.json
      - name: Commit
        if: github.event_name == 'schedule' || inputs.commit
        run: |
          git config user.name "tideline-chain"
          git config user.email "tideline-chain@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "data: freeze chain day"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 10; done
          exit 1
      - name: Tell Telegram the day was not frozen
        if: failure() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Tideline: the daily chain snapshot failed, so yesterday stays a gap. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/failed.txt"
          node pipeline/telegram.mjs "$RUNNER_TEMP/failed.txt"
